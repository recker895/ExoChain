name: exochain-production
x-runtime: &runtime
  image: exochain-engine:production
  build: ..
  env_file: ${RUNTIME_ENV_FILE:-production.env}
  environment: &environment
    ENVIRONMENT: production
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_HOST: redis
    RUN_DB_PATH: /app/data/decision_runs.db
    AIS_HISTORY_DB_PATH: /app/data/ais_history.db
    COPERNICUSMARINE_HTTPS_TIMEOUT: '10'
    COPERNICUSMARINE_HTTPS_RETRIES: '0'
    TRUSTED_HOSTS: ${PUBLIC_HOST:?PUBLIC_HOST required},localhost,127.0.0.1,api
    CORS_ORIGINS: https://${PUBLIC_HOST}
    OPERATOR_API_TOKEN_FILE: /run/secrets/operator_token
    APPROVER_API_TOKEN_FILE: /run/secrets/approver_token
    AISSTREAM_API_KEY_FILE: /run/secrets/ais_key
    BUSINESS_API_TOKEN_FILE: /run/secrets/business_token
    ERP_TOKEN_FILE: /run/secrets/erp_token
  secrets: [operator_token, approver_token, ais_key, business_token, erp_token]
  volumes: [state:/app/data, ./business:/business:ro]
  restart: unless-stopped
  stop_grace_period: 190s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka:/var/lib/kafka/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
      interval: 20s
      timeout: 10s
      retries: 6
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
  init:
    <<: *runtime
    restart: 'no'
    command: [python, -m, scripts.init_topics]
    depends_on:
      kafka: {condition: service_healthy}
  api:
    <<: *runtime
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/livez", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 4
  ais:
    <<: *runtime
    command: [python, -m, scripts.service, services.ais_ingestion]
    depends_on:
      init: {condition: service_completed_successfully}
  maritime:
    <<: *runtime
    command: [python, -m, scripts.service, services.maritime_consumer]
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  history:
    <<: *runtime
    command: [python, -m, scripts.service, services.ais_history_recorder]
    depends_on:
      init: {condition: service_completed_successfully}
  frontend:
    image: exochain-dashboard:production
    build: ../dashboard/frontend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 4
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment: {PUBLIC_HOST: '${PUBLIC_HOST:?PUBLIC_HOST required}'}
    ports: ['${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443']
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    secrets: [tls_cert, tls_key]
    depends_on: [api, frontend]
    restart: unless-stopped
volumes:
  state:
  kafka:
  redis:
secrets:
  operator_token: {file: ./secrets/operator_token}
  approver_token: {file: ./secrets/approver_token}
  ais_key: {file: ./secrets/ais_key}
  business_token: {file: ./secrets/business_token}
  erp_token: {file: ./secrets/erp_token}
  tls_cert: {file: ./tls/cert.pem}
  tls_key: {file: ./tls/key.pem}
